name: CI

# Validate every push/PR to master: the build merges clean, the merged Lua actually PARSES (a stock
# luac5.1 -p syntax gate -- exactly the check that can't be run on the dev box, which has no Lua), and the
# release zip packages without error. Uploads the zip as a short-lived artifact so a build can be grabbed
# and tried without cutting a release.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (for the syntax gate)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Build, syntax-check, and package
        run: |
          python3 build/merge.py
          luac5.1 -p dist/Ess.lua        # parse the merged chunk -- fails the build on any syntax error
          python3 build/manifest.py      # generate dist/ess.json (package.py bundles it into the zip)
          python3 build/nodes.py         # ess.json + api/nodes.overlay.json -> dist/nodes.json (+ generated JS)
          python3 build/package.py

      # The API drift gate. ess.json can't drift from src/ -- it's generated from it -- but the HAND-WRITTEN
      # surfaces can: the in-game console's REGISTRY, CAPABILITIES.md's tables, and each file's own header
      # comments. This fails the build if any of them names a function that isn't defined, which is otherwise
      # exactly the kind of divergence nobody notices until a beginner types something that doesn't exist.
      - name: API drift gate (docs vs. real functions)
        run: python3 build/manifest.py --check

      # The node overlay is hand-authored, so it CAN drift: a renamed function or parameter would leave the
      # editor offering a node that generates Lua calling something that no longer exists. Checked against
      # ess.json, same as everything else here.
      - name: Node overlay gate (hand-authored metadata vs. real signatures)
        run: python3 build/nodes.py --check

      # Executes the generated node definitions against a stubbed editor and asserts the LUA they produce --
      # crucially that a guid parameter is spliced raw rather than quoted, which is the difference between a
      # working node and one that silently does nothing.
      - name: Generated node behaviour
        run: node tools/test_nodes.js

      # The lua-bridge WebSocket result path, modelled end to end with no game: our wrapper -> a real tab in a
      # Lua string -> the bridge's JSON escaping -> JSON.parse -> the parsed result. The client drops
      # unparseable frames inside a catch, so a break here is SILENT (results just look like timeouts) --
      # which is precisely why it gets a test rather than a manual check.
      - name: Bridge WebSocket result handling
        run: node tools/test_bridge_client.js

      - name: Offline behavioral tests (pure namespaces + intent bundles)
        run: |
          python3 -m pip install --quiet lupa
          python3 tools/checkpure.py
          python3 tools/test_bundles.py

      - name: Upload built zip
        uses: actions/upload-artifact@v4
        with:
          name: Ess-zip
          path: dist/Ess-*.zip
          retention-days: 14
          if-no-files-found: error
